name: Validate and deploy Steel City / MinistryMesh site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate browser JavaScript
        run: node --check site/site.js

      - name: Validate Apps Script bundle syntax
        run: node --check < dist/Code.gs

      - name: Verify generated Apps Script bundle
        run: node scripts/build-apps-script.js --check

      - name: Run automation tests
        run: |
          node tests/automation.test.js
          node tests/prospect-intelligence.test.js
          node tests/site.test.js

      - name: Check required public files
        shell: bash
        run: |
          test -f site/index.html
          test -f site/book.html
          test -f site/privacy.html
          test -f site/terms.html
          test -f site/sitemap.xml
          test -f site/robots.txt
          test -f site/houses-of-worship.html
          test -f site/funeral-homes.html
          test -f site/daycares.html
          test -f site/healthcare-offices.html
          test -f site/trade-businesses.html
          test -f site/commercial-businesses.html
          test -f site/ministrymesh.html
          test -f site/ministrymesh-health-check.html
          test -f site/ministrymesh-v2.css
          test -f site/ministrymesh.css
          test -f site/assets/ministrymesh-logo.svg
          test -f site/assets/ministrymesh-logo-white.svg
          test -f site/assets/ministrymesh-mark.svg
          test -f site/assets/ministrymesh-hero.svg
          test -f site/gatherbeam.html
          test -f site/gatherbeam-health-check.html
          test -f site/gatherbeam-v2.css
          test -f site/assets/gatherbeam-logo.svg
          test -f site/assets/gatherbeam-logo-white.svg
          test -f site/assets/gatherbeam-mark.svg

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
